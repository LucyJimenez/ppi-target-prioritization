project_root: ..
input:
  path: data/raw/candidates.tsv
  header: true
annotation:
  orthogroup_file: data/raw/orthogroup_wbgene_mapping.tsv
  optional: true
biogrid:
  interaction_type: physical
  taxon: 6239
  tab3:
    path: data/external/tab3
    sha256: SET_BY_EXPLICIT_REFRESH
    database_version: unresolved
    retrieval_metadata: data/external/tab3.source_manifest.json
  gene_info:
    path: data/external/gene_info
    sha256: SET_BY_EXPLICIT_REFRESH
    database_version: unresolved
    retrieval_metadata: data/external/gene_info.source_manifest.json
external_failure_policy: report_to_user_before_method_substitution
network:
  community_seeds: 100
  consensus_threshold: 0.5
  resolution: 1.0
  resolution_sweep:
  - 0.5
  - 0.75
  - 1.0
  - 1.25
  - 1.5
  seed: 20260806
  hub_quantile: 0.95
  hub_quantile_sweep:
  - 0.9
  - 0.95
  - 0.975
  - 0.99
  hub_replicates: 100
  edge_retention: 0.9
  robust_fraction: 0.9
  pagerank_alpha: 0.85
  pagerank_max_iter: 100
  pagerank_tol: 1.0e-06
  eigen_max_iter: 3000
  eigen_tol: 1.0e-10
go:
  gaf:
    path: data/external/gaf
    sha256: SET_BY_EXPLICIT_REFRESH
    metadata: data/external/gaf.source_manifest.json
  obo:
    path: data/external/obo
    sha256: SET_BY_EXPLICIT_REFRESH
    metadata: data/external/obo.source_manifest.json
  fdr: 0.05
  background: all_LCC
  aspects:
  - P
  - F
  - C
  annotation: direct_positive
  propagate: false
bgee:
  source:
    path: data/external/bgee.tsv.gz
    sha256: SET_BY_EXPLICIT_REFRESH
    metadata: data/external/bgee.source_manifest.json
wormbase:
  deferred: true
  reason: Optional deferral; --source wormbase explicitly attempts this source
blast:
  target_gzip: data/external/human_target.fasta.gz
  target_headers: data/external/human_target.headers
  target_source: https://rest.uniprot.org/uniprotkb/stream?query=%28proteome%3AUP000005640%29%20AND%20%28organism_id%3A9606%29&format=fasta&includeIsoform=true&compressed=true
  evalue: 1.0e-05
  matrix: BLOSUM62
  gapopen: 11
  gapextend: 1
  word_size: 3
  comp_based_stats: 2
  seg: 'yes'
  soft_masking: 'false'
  threads: 4
  isoforms: all_available_named
  reciprocal: false
plotting:
  seed: 20260806
  spring_k: 0.13
  iterations: 700
  dpi: 400
  width_mm: 180
  fonts:
  - Arial
  - Helvetica
  - Liberation Sans
  - DejaVu Sans
